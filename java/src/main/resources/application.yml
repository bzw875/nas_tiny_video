server:
  port: ${PORT:4000}

spring:
  application:
    name: video-manager-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:192.168.1.20}:3306/video_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.20}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:8872goob}
      timeout: 3s

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors-origin: ${CORS_ORIGIN:}
  novel-txt-dir: ${NOVEL_TXT_DIR:./txt}
  gallery-dir: ${GALLERY_DIR:/home/banzhaowu/Pictures}
  cache-ttl-seconds: ${CACHE_TTL_SECONDS:300}
